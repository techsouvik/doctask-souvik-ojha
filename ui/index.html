<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuMesh — Document Reconciliation & Audit Engine</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6 Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
            }
          }
        }
      }
    }
  </script>

  <!-- Marked.js Markdown Parser CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Vis.js Network Standalone for Rock-Solid Interactive Graphs -->
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }

    /* Surface Styles */
    .glass {
      background: rgba(13, 19, 31, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .card-dark {
      background: #0d1424;
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .card-dark:hover {
      border-color: rgba(99, 102, 241, 0.3);
    }

    /* Markdown Prose */
    .prose-custom p { margin-bottom: 0.6rem; line-height: 1.6; font-size: 0.875rem; }
    .prose-custom p:last-child { margin-bottom: 0; }
    .prose-custom ul { list-style-type: disc; padding-left: 1.2rem; margin-bottom: 0.6rem; }
    .prose-custom ol { list-style-type: decimal; padding-left: 1.2rem; margin-bottom: 0.6rem; }
    .prose-custom li { margin-bottom: 0.2rem; }
    .prose-custom strong { color: #f8fafc; font-weight: 700; }
    .prose-custom code { 
      background: rgba(99, 102, 241, 0.15); 
      color: #c7d2fe; 
      padding: 0.15rem 0.35rem; 
      border-radius: 0.3rem; 
      font-family: 'JetBrains Mono', monospace; 
      font-size: 0.82em; 
    }

    /* Animation */
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .animate-pulse-soft {
      animation: pulse-soft 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-[#070a12] text-slate-100 font-sans antialiased h-screen overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    function App() {
      // Primary State
      const [projectId, setProjectId] = useState("proj_greenfield_tech_park");
      const [activeTab, setActiveTab] = useState("chat"); // 'chat', 'findings', 'graph', 'register'
      const [pipelineStatus, setPipelineStatus] = useState("AWAITING_HUMAN_GATE");
      const [currentNode, setCurrentNode] = useState("GATE");
      const [pendingCount, setPendingCount] = useState(0);

      // Data Collections
      const [projectsList, setProjectsList] = useState(["proj_greenfield_tech_park"]);
      const [documents, setDocuments] = useState([]);
      const [findings, setFindings] = useState([]);
      const [register, setRegister] = useState(null);
      const [graphData, setGraphData] = useState({ nodes: [], edges: [] });
      const [selectedDoc, setSelectedDoc] = useState(null);

      // UI Controls
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [spotlightOpen, setSpotlightOpen] = useState(false);
      const [spotlightQuery, setSpotlightQuery] = useState("");
      const [spotlightResults, setSpotlightResults] = useState([]);
      const [createModalOpen, setCreateModalOpen] = useState(false);
      const [newProjName, setNewProjName] = useState("");
      const [newDocPath, setNewDocPath] = useState("");
      const [findingFilter, setFindingFilter] = useState("ALL"); // ALL, PENDING, APPROVED, REJECTED

      // Chat State
      const [chatMessages, setChatMessages] = useState([
        {
          id: "m_welcome",
          role: "assistant",
          content: "### Welcome to **DocuMesh** 👋\n\nI am your **Document Reconciliation Assistant**. I audit contracts, invoices, status reports, and receipts to identify discrepancies and build a verified Project Register.\n\n• Ask any question across the document pile.\n• When ready, start the reconciliation audit.\n• Press `Cmd+K` anytime to search chunks with sub-30ms hybrid search.",
          action_payload: null,
          citations: []
        }
      ]);
      const [chatInput, setChatInput] = useState("");
      const [isStreaming, setIsStreaming] = useState(false);
      const [thinkingMsg, setThinkingMsg] = useState("");
      const [uploading, setUploading] = useState(false);

      // Notifications Toast
      const [toast, setToast] = useState(null);
      const showToast = (msg, type = "info") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Refs
      const messagesEndRef = useRef(null);
      const fileInputRef = useRef(null);
      const visContainerRef = useRef(null);
      const visNetworkRef = useRef(null);

      // Global Keyboard Shortcut (Cmd+K)
      useEffect(() => {
        const onKey = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            setSpotlightOpen(prev => !prev);
          }
          if (e.key === 'Escape') {
            setSpotlightOpen(false);
            setSelectedDoc(null);
            setCreateModalOpen(false);
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      // Load project data
      useEffect(() => {
        loadProject(projectId);
        loadProjectsList();
      }, [projectId]);

      // Scroll chat
      useEffect(() => {
        if (activeTab === "chat") {
          messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
        }
      }, [chatMessages, isStreaming, thinkingMsg]);

      const loadProjectsList = async () => {
        try {
          const res = await fetch("/api/v1/projects");
          if (res.ok) {
            const data = await res.json();
            if (data.projects) setProjectsList(data.projects);
          }
        } catch (e) {
          console.error(e);
        }
      };

      const loadProject = async (pId) => {
        const id = pId || projectId;
        try {
          // Status
          const stRes = await fetch(`/api/v1/projects/${id}/status`);
          if (stRes.ok) {
            const stData = await stRes.json();
            setPipelineStatus(stData.status);
            setCurrentNode(stData.current_node);
            setPendingCount(stData.pending_findings_count || 0);
          }

          // Documents
          const docRes = await fetch(`/api/v1/projects/${id}/documents`);
          if (docRes.ok) {
            const docData = await docRes.json();
            setDocuments(docData.documents || []);
          }

          // Findings
          const fRes = await fetch(`/api/v1/projects/${id}/findings`);
          if (fRes.ok) {
            const fData = await fRes.json();
            setFindings(fData.findings || []);
          }

          // Register
          const rRes = await fetch(`/api/v1/projects/${id}/register`);
          if (rRes.ok) {
            const rData = await rRes.json();
            setRegister(rData);
          } else {
            setRegister(null);
          }

          // Graph
          const gRes = await fetch(`/api/v1/projects/${id}/graph`);
          if (gRes.ok) {
            const gData = await gRes.json();
            setGraphData(gData);
          }
        } catch (e) {
          console.error("Load project error", e);
        }
      };

      // Trigger 7-Stage Pipeline Run
      const runPipeline = async () => {
        showToast("Running LangGraph reconciliation audit...", "info");
        try {
          const res = await fetch(`/api/v1/projects/${projectId}/run`, { method: "POST" });
          if (res.ok) {
            const data = await res.json();
            setPipelineStatus(data.status);
            setCurrentNode(data.current_node);
            setPendingCount(data.pending_findings_count || 0);
            showToast(`Audit complete: Paused at ${data.current_node}!`, "success");
            loadProject(projectId);

            setChatMessages(prev => [
              ...prev,
              {
                id: "m_" + Date.now(),
                role: "assistant",
                content: `### ⚡ Pipeline Execution Complete\n\n• **Processed Documents:** ${data.documents_count}\n• **Extracted Facts:** ${data.facts_count}\n• **Pending Discrepancies:** **${data.pending_findings_count}**\n\nThe engine is paused at the **Human Gate**. Click the button below to review and approve findings!`,
                action_payload: {
                  type: "GATE_FINDINGS",
                  findings: findings
                }
              }
            ]);
          }
        } catch (e) {
          showToast("Pipeline run failed.", "error");
        }
      };

      // Approve / Reject Finding
      const decideFinding = async (findingId, approved) => {
        try {
          const res = await fetch(`/api/v1/projects/${projectId}/findings/approve`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ finding_id: findingId, approved })
          });
          if (res.ok) {
            showToast(`Finding ${findingId} ${approved ? 'Approved' : 'Rejected'}!`, approved ? "success" : "info");
            loadProject(projectId);
          }
        } catch (e) {
          showToast("Decision failed", "error");
        }
      };

      // Batch Approve All
      const batchApproveAll = async () => {
        try {
          showToast("Batch approving all findings...", "info");
          const res = await fetch(`/api/v1/projects/${projectId}/findings/batch-approve`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ approved_all: true })
          });
          if (res.ok) {
            showToast("All findings approved! Register generated.", "success");
            loadProject(projectId);
            setActiveTab("register");
          }
        } catch (e) {
          showToast("Batch approve failed", "error");
        }
      };

      // File Upload
      const onFileUpload = async (e) => {
        const files = e.target.files;
        if (!files || files.length === 0) return;

        setUploading(true);
        showToast(`Uploading ${files.length} document(s)...`, "info");

        for (let i = 0; i < files.length; i++) {
          const form = new FormData();
          form.append("file", files[i]);
          try {
            const res = await fetch(`/api/v1/projects/${projectId}/documents`, {
              method: "POST",
              body: form
            });
            if (res.ok) {
              const data = await res.json();
              showToast(`Ingested ${data.filename || files[i].name}`, "success");
            }
          } catch (err) {
            showToast(`Upload failed for ${files[i].name}`, "error");
          }
        }

        setUploading(false);
        if (fileInputRef.current) fileInputRef.current.value = "";
        loadProject(projectId);
      };

      // Load Greenfield Demo Data into Empty Workspace
      const loadDemoData = async () => {
        showToast("Linking demo corpus...", "info");
        try {
          const res = await fetch("/api/v1/projects", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              project_name: "Greenfield Tech Park",
              doc_folder: "/Users/souvikojha/doctask-souvik-ojha/test_data/greenfield_tech_park"
            })
          });
          if (res.ok) {
            const data = await res.json();
            setProjectId(data.project_id);
            setProjectsList(prev => Array.from(new Set([...prev, data.project_id])));
            showToast("Demo corpus loaded!", "success");
            loadProject(data.project_id);
          }
        } catch (e) {
          showToast("Failed to load demo", "error");
        }
      };

      // Send Message with SSE
      const sendMessage = async (textToSend) => {
        const query = textToSend || chatInput;
        if (!query.trim()) return;

        setChatInput("");
        setChatMessages(prev => [...prev, { id: "u_" + Date.now(), role: "user", content: query }]);
        setIsStreaming(true);
        setThinkingMsg("Scanning document graph & vector chunks...");

        const asstId = "a_" + Date.now();
        setChatMessages(prev => [...prev, { id: asstId, role: "assistant", content: "", citations: [] }]);

        const encoded = encodeURIComponent(query);
        const eventSource = new EventSource(`/api/v1/projects/${projectId}/sessions/chat_session_main/stream?q=${encoded}`);

        let contentAcc = "";

        eventSource.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === "thinking") {
              setThinkingMsg(data.stage);
            } else if (data.type === "chunk") {
              setThinkingMsg("");
              contentAcc += data.content;
              setChatMessages(prev => {
                const next = [...prev];
                const last = next[next.length - 1];
                if (last && last.role === "assistant") last.content = contentAcc;
                return next;
              });
            } else if (data.type === "done") {
              setThinkingMsg("");
              setChatMessages(prev => {
                const next = [...prev];
                const last = next[next.length - 1];
                if (last && last.role === "assistant") {
                  last.action_payload = data.action_payload;
                  if (data.assistant_node?.citations) last.citations = data.assistant_node.citations;
                }
                return next;
              });
              eventSource.close();
              setIsStreaming(false);
              loadProject(projectId);
            }
          } catch (err) {
            console.error(err);
          }
        };

        eventSource.onerror = () => {
          eventSource.close();
          setIsStreaming(false);
          setThinkingMsg("");
        };
      };

      // Create Workspace
      const handleCreateProject = async () => {
        if (!newProjName.trim()) return;
        try {
          const res = await fetch("/api/v1/projects", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              project_name: newProjName,
              doc_folder: newDocPath || null
            })
          });
          if (res.ok) {
            const data = await res.json();
            setProjectId(data.project_id);
            setProjectsList(prev => [...prev, data.project_id]);
            setCreateModalOpen(false);
            setNewProjName("");
            setNewDocPath("");
            showToast(`Created workspace: ${data.project_id}`, "success");
            loadProject(data.project_id);
          }
        } catch (e) {
          showToast("Failed to create project", "error");
        }
      };

      // Spotlight Search
      const handleSearch = async (q) => {
        if (!q.trim()) {
          setSpotlightResults([]);
          return;
        }
        try {
          const res = await fetch(`/api/v1/projects/${projectId}/search`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: q, top_k: 5 })
          });
          if (res.ok) {
            const data = await res.json();
            setSpotlightResults(data.results || []);
          }
        } catch (e) {
          console.error(e);
        }
      };

      // Interactive Knowledge Graph via Vis.js Network
      useEffect(() => {
        if (activeTab === "graph" && visContainerRef.current && graphData.nodes && graphData.nodes.length > 0) {
          try {
            // Build Vis.js Nodes
            const visNodes = graphData.nodes.map(n => {
              const isDoc = n.type === "DOCUMENT" || n.group === "DOCUMENT";
              const isCrit = n.severity === "CRITICAL";

              return {
                id: n.id,
                label: isDoc ? n.label : (n.label || n.id),
                shape: isDoc ? "box" : "dot",
                size: isDoc ? undefined : (isCrit ? 22 : 16),
                color: isDoc ? {
                  background: "#1e1b4b",
                  border: "#6366f1",
                  highlight: { background: "#312e81", border: "#a5b4fc" }
                } : {
                  background: isCrit ? "#ef4444" : "#f59e0b",
                  border: isCrit ? "#b91c1c" : "#d97706",
                  highlight: { background: "#f87171", border: "#fca5a5" }
                },
                font: {
                  color: "#f8fafc",
                  face: "Plus Jakarta Sans, sans-serif",
                  size: isDoc ? 12 : 11,
                  multi: true
                },
                margin: isDoc ? 10 : undefined,
                borderWidth: 2,
                shadow: { enabled: true, color: "rgba(0,0,0,0.5)", size: 6 }
              };
            });

            // Build Vis.js Edges (Safe Check)
            const validNodeIds = new Set(graphData.nodes.map(n => n.id));
            const visEdges = (graphData.edges || [])
              .filter(e => validNodeIds.has(e.from) && validNodeIds.has(e.to))
              .map((e, idx) => ({
                id: `edge_${idx}`,
                from: e.from,
                to: e.to,
                label: e.label || "conflict",
                color: { color: e.is_conflict ? "#ef4444" : "#64748b", highlight: "#f87171" },
                arrows: { to: { enabled: true, scaleFactor: 0.75 } },
                dashes: e.is_conflict,
                width: 2,
                font: { color: "#94a3b8", size: 10, face: "JetBrains Mono" }
              }));

            const data = {
              nodes: new vis.DataSet(visNodes),
              edges: new vis.DataSet(visEdges)
            };

            const options = {
              physics: {
                solver: "forceAtlas2Based",
                forceAtlas2Based: {
                  gravitationalConstant: -50,
                  centralGravity: 0.01,
                  springLength: 100,
                  springConstant: 0.08
                },
                stabilization: { iterations: 150 }
              },
              interaction: {
                hover: true,
                zoomView: true,
                dragView: true
              }
            };

            if (visNetworkRef.current) {
              visNetworkRef.current.destroy();
            }

            visNetworkRef.current = new vis.Network(visContainerRef.current, data, options);

            visNetworkRef.current.on("click", (params) => {
              if (params.nodes.length > 0) {
                const clickedId = params.nodes[0];
                const foundDoc = documents.find(d => (d.doc_id === clickedId || d.filename === clickedId));
                if (foundDoc) setSelectedDoc(foundDoc);
              }
            });
          } catch (err) {
            console.error("Vis.js error", err);
          }
        }
      }, [activeTab, graphData, documents]);

      // Filtered findings
      const filteredFindings = useMemo(() => {
        if (findingFilter === "PENDING") return findings.filter(f => f.status === "PRESENTED");
        if (findingFilter === "APPROVED") return findings.filter(f => f.status === "APPROVED");
        if (findingFilter === "REJECTED") return findings.filter(f => f.status === "REJECTED");
        return findings;
      }, [findings, findingFilter]);

      // Stage name helper
      const getStageName = () => {
        if (pipelineStatus === "AWAITING_HUMAN_GATE") return "Awaiting Gate Approval";
        if (pipelineStatus === "COMPLETED" || pipelineStatus === "DELIVER") return "Reconciliation Completed";
        if (currentNode === "INGEST") return "1/7 Ingesting Files";
        if (currentNode === "CLASSIFY") return "2/7 Classifying Taxonomy";
        if (currentNode === "EXTRACT") return "3/7 Extracting Facts";
        if (currentNode === "RECONCILE") return "4/7 Cross-Doc Reconcile";
        if (currentNode === "EXAMINE") return "5/7 Rule Engine Examination";
        return pipelineStatus;
      };

      return (
        <div class="flex h-screen w-screen overflow-hidden bg-[#070a12] text-slate-100 font-sans">
          {/* Toast Alert */}
          {toast && (
            <div class={`fixed top-4 right-4 z-50 px-4 py-2.5 rounded-xl border text-xs font-semibold shadow-2xl flex items-center gap-2.5 transition ${
              toast.type === 'success' ? 'bg-emerald-950/95 text-emerald-300 border-emerald-500/40' :
              toast.type === 'error' ? 'bg-rose-950/95 text-rose-300 border-rose-500/40' :
              'bg-slate-900/95 text-indigo-300 border-indigo-500/40'
            }`}>
              <i class={`fa-solid ${toast.type === 'success' ? 'fa-check' : toast.type === 'error' ? 'fa-xmark' : 'fa-info'} text-sm`}></i>
              <span>{toast.msg}</span>
            </div>
          )}

          {/* Hidden File Input */}
          <input
            type="file"
            ref={fileInputRef}
            onChange={onFileUpload}
            multiple
            accept=".docx,.pdf,.txt,.xlsx,.csv"
            class="hidden"
          />

          {/* LEFT SIDEBAR */}
          <aside class={`${sidebarOpen ? "w-72" : "w-0"} glass border-r border-slate-800/80 flex flex-col transition-all duration-300 overflow-hidden shrink-0 z-20`}>
            {/* Logo */}
            <div class="p-4 border-b border-slate-800/80 flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center text-white text-xs font-bold shadow-lg shadow-indigo-600/30">
                  <i class="fa-solid fa-cube"></i>
                </div>
                <span class="font-bold text-sm text-white tracking-tight">DocuMesh</span>
              </div>
              <button onClick={() => setSidebarOpen(false)} class="text-slate-400 hover:text-white p-1">
                <i class="fa-solid fa-chevron-left text-xs"></i>
              </button>
            </div>

            {/* Workspace Select */}
            <div class="p-3 border-b border-slate-800/80 bg-slate-950/40">
              <div class="flex items-center justify-between text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">
                <span>Active Workspace</span>
                <button onClick={() => setCreateModalOpen(true)} class="text-indigo-400 hover:text-indigo-300">
                  + New
                </button>
              </div>
              <select
                value={projectId}
                onChange={(e) => setProjectId(e.target.value)}
                class="w-full px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs text-slate-200 font-mono focus:outline-none focus:border-indigo-500"
              >
                {projectsList.map(p => (
                  <option key={p} value={p}>{p}</option>
                ))}
              </select>
            </div>

            {/* Nav Tabs */}
            <div class="p-3 border-b border-slate-800/80 space-y-1">
              <button
                onClick={() => setActiveTab("chat")}
                class={`w-full text-left px-3 py-2 rounded-lg text-xs font-semibold flex items-center justify-between transition ${
                  activeTab === "chat" ? "bg-indigo-600/20 text-indigo-300 border border-indigo-500/30" : "text-slate-400 hover:text-slate-200 hover:bg-slate-900/60"
                }`}
              >
                <div class="flex items-center gap-2.5">
                  <i class="fa-solid fa-message text-indigo-400"></i>
                  <span>Assistant Chat</span>
                </div>
              </button>

              <button
                onClick={() => setActiveTab("findings")}
                class={`w-full text-left px-3 py-2 rounded-lg text-xs font-semibold flex items-center justify-between transition ${
                  activeTab === "findings" ? "bg-amber-600/20 text-amber-300 border border-amber-500/30" : "text-slate-400 hover:text-slate-200 hover:bg-slate-900/60"
                }`}
              >
                <div class="flex items-center gap-2.5">
                  <i class="fa-solid fa-scale-balanced text-amber-400"></i>
                  <span>Discrepancies (Gate)</span>

          {/* MAIN VIEW */}

                <div class="flex items-center gap-2">

                    pipelineStatus === "AWAITING_HUMAN_GATE" ? "bg-amber-950/80 text-amber-300 border-amber-500/40 animate-pulse-soft" :
                    pipelineStatus === "COMPLETED" || pipelineStatus === "DELIVER" ? "bg-emerald-950/80 text-emerald-300 border-emerald-500/40" :
                    "bg-slate-900 text-slate-400 border-slate-800"

                  <i class="fa-solid fa-magnifying-glass text-indigo-400"></i>

                    onClick={() => fileInputRef.current?.click()}

                          onClick={() => fileInputRef.current?.click()}

                                    {c.filename} {c.location && `(${c.location})`}
                                  </span>

                              </div>

                                  <button
                                    onClick={() => setActiveTab("findings")}
                                    class="px-2.5 py-1 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold rounded"
                                  >
                                    Review Findings Tab
                                  </button>
                                </div>
                              </div>

                      {isStreaming && (

                          <span>{thinkingMsg || "Reasoning..."}</span>
                        </div>
                      )}
                      <div ref={messagesEndRef} />
                    </div>
                  )}

                  {/* Input Form */}
                  <div class="p-4 border-t border-slate-800/80 glass">

                        onClick={() => fileInputRef.current?.click()}
                        class="px-3 py-2.5 card-dark text-slate-400 hover:text-white rounded-xl"
                        title="Attach file"
                      >
                        <i class="fa-solid fa-paperclip"></i>
                      </button>
                      <input
                        type="text"
                        value={chatInput}
                        onChange={(e) => setChatInput(e.target.value)}

                        class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-sm transition"

                        <i class="fa-solid fa-paper-plane"></i>
                      </button>
                    </form>
                  </div>
                </div>

              {/* TAB 2: DISCREPANCIES (HUMAN GATE) */}

                            key={f}
                            onClick={() => setFindingFilter(f)}
                            class={`px-2.5 py-1 rounded font-semibold transition ${findingFilter === f ? "bg-indigo-600 text-white" : "text-slate-400 hover:text-white"}`}
                          >
                            {f}
                          </button>
                        ))}
                      </div>

                      {pendingCount > 0 && (
                        <button
                          onClick={batchApproveAll}
                          class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-lg transition"

                      filteredFindings.map((f) => {
                        const isPending = f.status === "PRESENTED";
                        const isApproved = f.status === "APPROVED";
                        const isRejected = f.status === "REJECTED";

                        return (
                          <div key={f.finding_id} class="card-dark rounded-xl p-5 space-y-3">

                                  f.severity === "CRITICAL" ? "bg-rose-950 text-rose-300 border border-rose-800" :

                                  {f.severity}
                                </span>

                                <h3 class="text-sm font-bold text-white">{f.title}</h3>
                              </div>

                              {/* Status Badge */}
                              <div>
                                {isApproved && (
                                  <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                                    <i class="fa-solid fa-check mr-1"></i> APPROVED
                                  </span>
                                )}
                                {isRejected && (
                                  <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30">
                                    <i class="fa-solid fa-xmark mr-1"></i> REJECTED
                                  </span>
                                )}
                                {isPending && (
                                  <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">
                                    AWAITING REVIEW
                                  </span>
                                )}
                              </div>
                            </div>

                            <p class="text-xs text-slate-300">{f.description}</p>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 my-2 text-xs">
                              <div class="p-3 rounded-lg bg-slate-950/80 border border-slate-800 space-y-1">

                              <div class="p-3 rounded-lg bg-slate-950/80 border border-slate-800 space-y-1">
                                <span class="text-rose-300 font-semibold block">{f.source_b?.filename || "Contradiction"}</span>
                                <p class="font-mono text-[11px] text-rose-200 italic">"{f.source_b?.exact_quote || 'Discrepancy'}"</p>
                              </div>

                            {f.resolution_action && (
                              <div class="p-2.5 rounded-lg bg-emerald-950/30 border border-emerald-500/20 text-xs text-emerald-300">

                                  class="text-[11px] text-slate-500 hover:text-slate-300 underline"
                                >
                                  Change Decision
                                </button>
                              </div>
                            )}
                          </div>
                        );
                      })
                    )}
                  </div>

              {activeTab === "graph" && (

                    {register && (
                      <a
                        href={`/api/v1/projects/${projectId}/export-report`}

                            <tr>
                              <th class="p-3">Entity / Metric</th>
                              <th class="p-3">Reconciled Value</th>
                              <th class="p-3">Status</th>
                              <th class="p-3">Citation</th>
                            </tr>
                          </thead>
                          <tbody class="divide-y divide-slate-800/80">
                            {register.entries.map((e, idx) => (
                              <tr key={idx} class="hover:bg-slate-900/40">

                                <td class="p-3">
                                  <span class={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                    e.status === 'CORROBORATED' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-purple-500/20 text-purple-300'

                                    {e.status}
                                  </span>
                                </td>
                                <td class="p-3 text-slate-400 font-mono text-[11px]">{e.primary_citation?.filename}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </main>
          </div>

          {/* SPOTLIGHT SEARCH (CMD+K) */}
          {spotlightOpen && (
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-start justify-center pt-20 p-4 z-50">
              <div class="glass p-5 rounded-2xl max-w-xl w-full border border-indigo-500/40 shadow-2xl space-y-3">
                <div class="flex items-center gap-2 pb-2 border-b border-slate-800">
                  <i class="fa-solid fa-magnifying-glass text-indigo-400"></i>
                  <input
                    type="text"
                    value={spotlightQuery}
                    onChange={(e) => {
                      setSpotlightQuery(e.target.value);
                      handleSearch(e.target.value);

                    placeholder="Search across all document chunks (BM25 Hybrid)..."
                    class="flex-1 bg-transparent text-sm text-white focus:outline-none"

                  />
                  <kbd class="px-1.5 py-0.5 bg-slate-900 text-slate-400 text-[10px] rounded">ESC</kbd>
                </div>
                <div class="max-h-80 overflow-y-auto space-y-2">
                  {spotlightResults.map((r, idx) => (
                    <div key={idx} class="p-3 rounded-lg bg-slate-900 border border-slate-800 text-xs space-y-1">
                      <div class="text-indigo-300 font-semibold">{r.doc_name}</div>
                      <p class="text-slate-300 font-mono text-[11px]">"{r.text}"</p>
                    </div>

                </div>
              </div>
            </div>
          )}

          {/* DOCUMENT INSPECTOR */}
          {selectedDoc && (
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div class="glass p-6 rounded-2xl max-w-2xl w-full border border-slate-800 shadow-2xl flex flex-col max-h-[80vh]">
                <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                  <h3 class="text-sm font-bold text-white">{selectedDoc.filename}</h3>

                    <i class="fa-solid fa-xmark"></i>
                  </button>

                <div class="p-3 my-3 bg-slate-950 rounded-xl font-mono text-xs text-slate-300 overflow-y-auto flex-1 whitespace-pre-wrap">
                  {selectedDoc.extracted_text || "No preview text."}

          {/* CREATE PROJECT MODAL */}
          {createModalOpen && (
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div class="glass p-5 rounded-2xl max-w-md w-full border border-slate-800 shadow-2xl space-y-3">
                <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                  <h3 class="text-sm font-bold text-white">Create New Workspace</h3>
                  <button onClick={() => setCreateModalOpen(false)} class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                  </button>
                </div>
                <div class="space-y-2 text-xs">
                  <div>
                    <label class="text-slate-400 block mb-1">Project Name:</label>
                    <input
                      type="text"
                      value={newProjName}
                      onChange={(e) => setNewProjName(e.target.value)}
                      placeholder="e.g. Audit Phase 2"
                      class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div>
                    <label class="text-slate-400 block mb-1">Document Folder (Optional):</label>
                    <input
                      type="text"
                      value={newDocPath}
                      onChange={(e) => setNewDocPath(e.target.value)}
                      placeholder="Leave empty to upload files later"
                      class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-white font-mono text-[11px] focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                  <button onClick={() => setCreateModalOpen(false)} class="px-3 py-1.5 text-xs text-slate-400 hover:text-white">Cancel</button>
                  <button onClick={handleCreateProject} class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-lg">Create</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
