<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuMesh Engine — Multi-Document Reconciliation</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            slate: {
              950: '#020617',
              900: '#0f172a',
              850: '#131d38',
              800: '#1e293b',
            }
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Marked.js for Markdown Formatting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Vis.js Network for Interactive Knowledge Graph -->
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.4);
      border-radius: 4px;
    }
    .glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .card-dark {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(51, 65, 85, 0.6);
    }
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.02); }
    }
    .animate-pulse-soft {
      animation: pulse-soft 2s infinite ease-in-out;
    }
    /* Markdown Styles */
    .prose-dark h1, .prose-dark h2, .prose-dark h3, .prose-dark h4 {
      color: #f8fafc;
      font-weight: 700;
      margin-top: 0.5rem;
      margin-bottom: 0.25rem;
    }
    .prose-dark p {
      margin-bottom: 0.5rem;
      line-height: 1.5;
    }
    .prose-dark ul {
      list-style-type: disc;
      margin-left: 1.25rem;
      margin-bottom: 0.5rem;
    }
    .prose-dark strong {
      color: #818cf8;
    }
    .prose-dark code {
      font-family: 'JetBrains Mono', monospace;
      background: rgba(15, 23, 42, 0.8);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      font-size: 0.85em;
      border: 1px solid rgba(99, 102, 241, 0.2);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 overflow-hidden select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // Core State
      const [projectId, setProjectId] = useState("proj_greenfield_tech_park");
      const [projectsList, setProjectsList] = useState(["proj_greenfield_tech_park"]);
      const [activeTab, setActiveTab] = useState("chat"); // chat, findings, graph, register
      
      // Project Pipeline State
      const [pipelineStatus, setPipelineStatus] = useState("AWAITING_HUMAN_GATE");
      const [currentNode, setCurrentNode] = useState("GATE");
      const [documents, setDocuments] = useState([]);
      const [findings, setFindings] = useState([]);
      const [register, setRegister] = useState(null);
      const [pendingCount, setPendingCount] = useState(0);
      const [graphData, setGraphData] = useState({ nodes: [], edges: [] });
      
      // UI Modals & Sidebars
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [selectedDoc, setSelectedDoc] = useState(null);
      const [spotlightOpen, setSpotlightOpen] = useState(false);
      const [spotlightQuery, setSpotlightQuery] = useState("");
      const [spotlightResults, setSpotlightResults] = useState([]);
      const [createModalOpen, setCreateModalOpen] = useState(false);
      const [newProjName, setNewProjName] = useState("");
      const [newDocPath, setNewDocPath] = useState("");
      const [findingFilter, setFindingFilter] = useState("ALL"); // ALL, PENDING, APPROVED, REJECTED

      // Per-Project Chat Histories Map (projectId -> messages[])
      const [projectChatMap, setProjectChatMap] = useState({
        "proj_greenfield_tech_park": [
          {
            id: "m_welcome_greenfield",
            role: "assistant",
            content: "### Welcome to **DocuMesh** 👋\n\nI am your **Document Reconciliation Assistant** for **Greenfield Tech Park**.\n\n• **8 Documents Ingested** across Contracts, Invoices, Status Reports & Delivery Gate Passes.\n• **5 Cross-Document Discrepancies** detected and awaiting your approval.\n• Ask any question or click **Approve Findings** to generate the Reconciled Register!",
            action_payload: null,
            citations: []
          }
        ]
      });

      // Active Chat State (computed for active projectId)
      const chatMessages = projectChatMap[projectId] || [
        {
          id: "m_welcome_" + projectId,
          role: "assistant",
          content: `### Welcome to Workspace **${projectId}** 👋\n\nThis is a clean, fresh workspace with **0 documents**.\n\n• Attach documents (.docx, .pdf, .txt) using the 📎 button or click **Upload Documents**.\n• Once uploaded, ask questions or start the reconciliation audit!\n• Press \`Cmd+K\` anytime to search document chunks.`,
          action_payload: null,
          citations: []
        }
      ];

      const setChatMessages = (updater) => {
        setProjectChatMap(prev => {
          const current = prev[projectId] || [
            {
              id: "m_welcome_" + projectId,
              role: "assistant",
              content: `### Welcome to Workspace **${projectId}** 👋\n\nThis is a clean, fresh workspace with **0 documents**.\n\n• Attach documents (.docx, .pdf, .txt) using the 📎 button or click **Upload Documents**.\n• Once uploaded, ask questions or start the reconciliation audit!\n• Press \`Cmd+K\` anytime to search document chunks.`,
              action_payload: null,
              citations: []
            }
          ];
          const updated = typeof updater === 'function' ? updater(current) : updater;
          return {
            ...prev,
            [projectId]: updated
          };
        });
      };

      const [chatInput, setChatInput] = useState("");
      const [isStreaming, setIsStreaming] = useState(false);
      const [thinkingMsg, setThinkingMsg] = useState("");
      const [uploading, setUploading] = useState(false);

      // Notifications Toast
      const [toast, setToast] = useState(null);
      const showToast = (msg, type = "info") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Refs
      const messagesEndRef = useRef(null);
      const fileInputRef = useRef(null);
      const visContainerRef = useRef(null);
      const visNetworkRef = useRef(null);

      // Global Keyboard Shortcut (Cmd+K)
      useEffect(() => {
        const onKey = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            setSpotlightOpen(prev => !prev);
          }
          if (e.key === 'Escape') {
            setSpotlightOpen(false);
            setSelectedDoc(null);
            setCreateModalOpen(false);
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      // Load project data
      useEffect(() => {
        loadProject(projectId);
        loadProjectsList();
      }, [projectId]);

      // Scroll chat
      useEffect(() => {
        if (activeTab === "chat") {
          messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
        }
      }, [chatMessages, isStreaming, thinkingMsg]);

      const loadProjectsList = async () => {
        try {
          const res = await fetch("/api/v1/projects");
          if (res.ok) {
            const data = await res.json();
            if (data.projects) setProjectsList(data.projects);
          }
        } catch (e) {
          console.error(e);
        }
      };

      const loadProject = async (pId) => {
        const id = pId || projectId;
        try {
          // Status
          const stRes = await fetch(`/api/v1/projects/${id}/status`);
          if (stRes.ok) {
            const stData = await stRes.json();
            setPipelineStatus(stData.status);
            setCurrentNode(stData.current_node);
            setPendingCount(stData.pending_findings_count || 0);
          }

          // Documents
          const docRes = await fetch(`/api/v1/projects/${id}/documents`);
          if (docRes.ok) {
            const docData = await docRes.json();
            setDocuments(docData.documents || []);
          }

          // Findings
          const fRes = await fetch(`/api/v1/projects/${id}/findings`);
          if (fRes.ok) {
            const fData = await fRes.json();
            setFindings(fData.findings || []);
          }

          // Register
          const rRes = await fetch(`/api/v1/projects/${id}/register`);
          if (rRes.ok) {
            const rData = await rRes.json();
            setRegister(rData);
          } else {
            setRegister(null);
          }

          // Graph
          const gRes = await fetch(`/api/v1/projects/${id}/graph`);
          if (gRes.ok) {
            const gData = await gRes.json();
            setGraphData(gData);
          }
        } catch (e) {
          console.error("Load project error", e);
        }
      };

      // Trigger 7-Stage Pipeline Run
      const runPipeline = async () => {
        showToast("Running LangGraph reconciliation audit...", "info");
        try {
          const res = await fetch(`/api/v1/projects/${projectId}/run`, { method: "POST" });
          if (res.ok) {
            const data = await res.json();
            setPipelineStatus(data.status);
            setCurrentNode(data.current_node);
            setPendingCount(data.pending_findings_count || 0);
            showToast(`Audit complete: Paused at ${data.current_node}!`, "success");
            loadProject(projectId);

            setChatMessages(prev => [
              ...prev,
              {
                id: "m_" + Date.now(),
                role: "assistant",
                content: `### ⚡ Pipeline Execution Complete\n\n• **Processed Documents:** ${data.documents_count}\n• **Extracted Facts:** ${data.facts_count}\n• **Pending Discrepancies:** **${data.pending_findings_count}**\n\nThe engine is paused at the **Human Gate**. Click the button below to review and approve findings!`,
                action_payload: {
                  type: "GATE_FINDINGS",
                  findings: findings
                }
              }
            ]);
          }
        } catch (e) {
          showToast("Pipeline run failed.", "error");
        }
      };

      // Approve / Reject Finding
      const decideFinding = async (findingId, approved) => {
        try {
          const res = await fetch(`/api/v1/projects/${projectId}/findings/approve`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ finding_id: findingId, approved })
          });
          if (res.ok) {
            showToast(`Finding ${findingId} ${approved ? 'Approved' : 'Rejected'}!`, approved ? "success" : "info");
            loadProject(projectId);
          }
        } catch (e) {
          showToast("Decision failed", "error");
        }
      };

      // Batch Approve All
      const batchApproveAll = async () => {
        try {
          showToast("Batch approving all findings...", "info");
          const res = await fetch(`/api/v1/projects/${projectId}/findings/batch-approve`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ approved_all: true })
          });
          if (res.ok) {
            showToast("All findings approved! Register generated.", "success");
            loadProject(projectId);
            setActiveTab("register");
          }
        } catch (e) {
          showToast("Batch approve failed", "error");
        }
      };

      // File Upload
      const onFileUpload = async (e) => {
        const files = e.target.files;
        if (!files || files.length === 0) return;

        setUploading(true);
        showToast(`Uploading ${files.length} document(s)...`, "info");

        for (let i = 0; i < files.length; i++) {
          const form = new FormData();
          form.append("file", files[i]);
          try {
            const res = await fetch(`/api/v1/projects/${projectId}/documents`, {
              method: "POST",
              body: form
            });
            if (res.ok) {
              const data = await res.json();
              showToast(`Ingested ${data.filename || files[i].name}`, "success");
            }
          } catch (err) {
            showToast(`Upload failed for ${files[i].name}`, "error");
          }
        }

        setUploading(false);
        if (fileInputRef.current) fileInputRef.current.value = "";
        loadProject(projectId);
      };

      // Create Fresh Isolated New Conversation / Workspace
      const handleNewConversation = async () => {
        const newId = `proj_chat_${Date.now().toString().slice(-6)}`;
        try {
          const res = await fetch("/api/v1/projects", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              project_name: newId
            })
          });
          if (res.ok) {
            const data = await res.json();
            const freshId = data.project_id;
            
            // Set fresh project chat greeting
            setProjectChatMap(prev => ({
              ...prev,
              [freshId]: [
                {
                  id: "m_welcome_" + freshId,
                  role: "assistant",
                  content: `### Welcome to New Workspace **${freshId}** 👋\n\nThis is a clean, fresh conversation workspace with **0 documents**.\n\n• Attach your documents (.docx, .pdf, .txt) using the 📎 button or click **Upload Documents** above.\n• Ask questions or click **Run Reconciliation Audit** when ready!`,
                  action_payload: null,
                  citations: []
                }
              ]
            }));

            setProjectsList(prev => [freshId, ...prev.filter(p => p !== freshId)]);
            setProjectId(freshId);
            setActiveTab("chat");
            showToast(`New conversation started: ${freshId}`, "success");
          }
        } catch (e) {
          showToast("Failed to start new conversation", "error");
        }
      };

      // Load Greenfield Demo Data into Workspace
      const loadDemoData = async () => {
        showToast("Linking demo corpus...", "info");
        try {
          const res = await fetch("/api/v1/projects", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              project_name: "Greenfield Tech Park",
              doc_folder: "/Users/souvikojha/doctask-souvik-ojha/test_data/greenfield_tech_park"
            })
          });
          if (res.ok) {
            const data = await res.json();
            setProjectId(data.project_id);
            setProjectsList(prev => Array.from(new Set([...prev, data.project_id])));
            showToast("Demo corpus loaded!", "success");
            loadProject(data.project_id);
          }
        } catch (e) {
          showToast("Failed to load demo", "error");
        }
      };

      // Send Message with SSE
      const sendMessage = async (textToSend) => {
        const query = textToSend || chatInput;
        if (!query.trim()) return;

        setChatInput("");
        setChatMessages(prev => [...prev, { id: "u_" + Date.now(), role: "user", content: query }]);
        setIsStreaming(true);
        setThinkingMsg("Scanning document graph & vector chunks...");

        const asstId = "a_" + Date.now();
        setChatMessages(prev => [...prev, { id: asstId, role: "assistant", content: "", citations: [] }]);

        const encoded = encodeURIComponent(query);
        const eventSource = new EventSource(`/api/v1/projects/${projectId}/sessions/session_${projectId}/stream?q=${encoded}`);

        let contentAcc = "";

        eventSource.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === "thinking") {
              setThinkingMsg(data.stage);
            } else if (data.type === "chunk") {
              setThinkingMsg("");
              contentAcc += data.content;
              setChatMessages(prev => {
                const next = [...prev];
                const last = next[next.length - 1];
                if (last && last.role === "assistant") last.content = contentAcc;
                return next;
              });
            } else if (data.type === "done") {
              setThinkingMsg("");
              setChatMessages(prev => {
                const next = [...prev];
                const last = next[next.length - 1];
                if (last && last.role === "assistant") {
                  last.action_payload = data.action_payload;
                  if (data.assistant_node?.citations) last.citations = data.assistant_node.citations;
                }
                return next;
              });
              eventSource.close();
              setIsStreaming(false);
              loadProject(projectId);
            }
          } catch (err) {
            console.error(err);
          }
        };

        eventSource.onerror = () => {
          eventSource.close();
          setIsStreaming(false);
          setThinkingMsg("");
        };
      };

      // Create Workspace via Modal
      const handleCreateProject = async () => {
        if (!newProjName.trim()) return;
        try {
          const res = await fetch("/api/v1/projects", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              project_name: newProjName,
              doc_folder: newDocPath || null
            })
          });
          if (res.ok) {
            const data = await res.json();
            const freshId = data.project_id;

            setProjectChatMap(prev => ({
              ...prev,
              [freshId]: [
                {
                  id: "m_welcome_" + freshId,
                  role: "assistant",
                  content: `### Welcome to Workspace **${newProjName}** 👋\n\nThis is a clean, fresh workspace.\n\n• Attach documents (.docx, .pdf, .txt) using the 📎 button or click **Upload Documents** above.\n• Once uploaded, ask questions or start the reconciliation audit!\n• Press \`Cmd+K\` anytime to search document chunks.`,
                  action_payload: null,
                  citations: []
                }
              ]
            }));

            setProjectId(freshId);
            setProjectsList(prev => [freshId, ...prev.filter(p => p !== freshId)]);
            setCreateModalOpen(false);
            setNewProjName("");
            setNewDocPath("");
            setActiveTab("chat");
            showToast(`Created workspace: ${freshId}`, "success");
            loadProject(freshId);
          }
        } catch (e) {
          showToast("Failed to create project", "error");
        }
      };

      // Spotlight Search
      const handleSearch = async (q) => {
        if (!q.trim()) {
          setSpotlightResults([]);
          return;
        }
        try {
          const res = await fetch(`/api/v1/projects/${projectId}/search`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: q, top_k: 5 })
          });
          if (res.ok) {
            const data = await res.json();
            setSpotlightResults(data.results || []);
          }
        } catch (e) {
          console.error(e);
        }
      };

      // Interactive Knowledge Graph via Vis.js Network
      useEffect(() => {
        if (activeTab === "graph" && visContainerRef.current && graphData.nodes && graphData.nodes.length > 0) {
          try {
            const visNodes = graphData.nodes.map(n => {
              const isDoc = n.type === "DOCUMENT" || n.group === "DOCUMENT";
              const isCrit = n.severity === "CRITICAL";

              return {
                id: n.id,
                label: isDoc ? n.label : (n.label || n.id),
                shape: isDoc ? "box" : "dot",
                size: isDoc ? undefined : (isCrit ? 22 : 16),
                color: isDoc ? {
                  background: "#1e1b4b",
                  border: "#6366f1",
                  highlight: { background: "#312e81", border: "#a5b4fc" }
                } : {
                  background: isCrit ? "#ef4444" : "#f59e0b",
                  border: isCrit ? "#b91c1c" : "#d97706",
                  highlight: { background: "#f87171", border: "#fca5a5" }
                },
                font: {
                  color: "#f8fafc",
                  face: "Plus Jakarta Sans, sans-serif",
                  size: isDoc ? 12 : 11,
                  multi: true
                },
                margin: isDoc ? 10 : undefined,
                borderWidth: 2,
                shadow: { enabled: true, color: "rgba(0,0,0,0.5)", size: 6 }
              };
            });

            const validNodeIds = new Set(graphData.nodes.map(n => n.id));
            const visEdges = (graphData.edges || [])
              .filter(e => validNodeIds.has(e.from) && validNodeIds.has(e.to))
              .map((e, idx) => ({
                id: `edge_${idx}`,
                from: e.from,
                to: e.to,
                label: e.label || "conflict",
                color: { color: e.is_conflict ? "#ef4444" : "#64748b", highlight: "#f87171" },
                arrows: { to: { enabled: true, scaleFactor: 0.75 } },
                dashes: e.is_conflict,
                width: 2,
                font: { color: "#94a3b8", size: 10, face: "JetBrains Mono" }
              }));

            const container = visContainerRef.current;
            const data = {
              nodes: new vis.DataSet(visNodes),
              edges: new vis.DataSet(visEdges)
            };
            const options = {
              physics: {
                solver: "forceAtlas2Based",
                forceAtlas2Based: {
                  gravitationalConstant: -50,
                  centralGravity: 0.01,
                  springLength: 120,
                  springConstant: 0.08
                },
                stabilization: { iterations: 120 }
              },
              interaction: {
                hover: true,
                tooltipDelay: 200,
                zoomView: true
              }
            };

            if (visNetworkRef.current) visNetworkRef.current.destroy();
            visNetworkRef.current = new vis.Network(container, data, options);
          } catch (e) {
            console.error("Vis.js render error", e);
          }
        }
      }, [activeTab, graphData]);

      // Stage Name Formatter
      const getStageName = () => {
        if (pipelineStatus === "AWAITING_HUMAN_GATE") return "Stage 6: Human Gate (Awaiting Review)";
        if (pipelineStatus === "COMPLETED" || pipelineStatus === "DELIVER") return "Stage 7: Deliver (Complete)";
        if (pipelineStatus === "CREATED" || pipelineStatus === "INIT") return "Stage 1: Ready to Ingest";
        return `Current Stage: ${currentNode || pipelineStatus}`;
      };

      // Filtered Findings
      const filteredFindings = findings.filter(f => {
        if (findingFilter === "ALL") return true;
        if (findingFilter === "PENDING") return f.approval_status === "PENDING";
        if (findingFilter === "APPROVED") return f.approval_status === "APPROVED";
        if (findingFilter === "REJECTED") return f.approval_status === "REJECTED";
        return true;
      });

      return (
        <div class="flex h-screen w-screen overflow-hidden bg-slate-950 font-sans">
          {/* Toast Notification */}
          {toast && (
            <div class={`fixed top-4 right-4 z-50 px-4 py-2.5 rounded-xl shadow-2xl border text-xs font-semibold flex items-center gap-2.5 transition-all transform animate-bounce ${
              toast.type === "error" ? "bg-red-950/90 border-red-500/50 text-red-200" :
              toast.type === "success" ? "bg-emerald-950/90 border-emerald-500/50 text-emerald-200" :
              "bg-indigo-950/90 border-indigo-500/50 text-indigo-200"
            }`}>
              <i class={`fa-solid ${
                toast.type === "error" ? "fa-circle-exclamation text-red-400" :
                toast.type === "success" ? "fa-circle-check text-emerald-400" :
                "fa-circle-info text-indigo-400"
              }`}></i>
              <span>{toast.msg}</span>
            </div>
          )}

          {/* Hidden File Input */}
          <input
            type="file"
            ref={fileInputRef}
            onChange={onFileUpload}
            multiple
            accept=".docx,.pdf,.txt,.xlsx,.csv"
            class="hidden"
          />

          {/* LEFT SIDEBAR */}

              {/* TAB 3: VIS.JS KNOWLEDGE GRAPH */}
              {activeTab === "graph" && (
                <div class="h-full flex flex-col relative">
                  <div class="absolute top-4 left-6 z-10 p-3 glass rounded-xl border border-slate-800 text-xs text-slate-300 space-y-1">
                    <div class="font-bold text-white flex items-center gap-1.5">
                      <i class="fa-solid fa-circle-nodes text-cyan-400"></i>
                      Document Contradiction Knowledge Graph
                    </div>
                    <div class="text-[10px] text-slate-400">
                      Drag nodes, zoom, and click to inspect document-to-finding conflict links.
                    </div>
                  </div>
                  <div ref={visContainerRef} class="w-full h-full bg-slate-950" />
                </div>
              )}

              {/* TAB 4: RECONCILED REGISTER */}
              {activeTab === "register" && (
                <div class="h-full flex flex-col p-6 overflow-hidden">
                  <div class="flex items-center justify-between mb-4 shrink-0">
                    <div>
                      <h2 class="text-base font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-table-list text-emerald-400"></i>
                        <span>Reconciled Project Register</span>
                      </h2>
                      <p class="text-xs text-slate-400 mt-0.5">
                        Deliverable audit ledger reconciling all facts and approved contract corrigendums.
                      </p>
                    </div>

                    <button
                      onClick={() => showToast("Exporting PDF & DOCX via SuperDocs...", "success")}
                      class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-lg transition shadow flex items-center gap-1.5"
                    >
                      <i class="fa-solid fa-file-export"></i> Export PDF/DOCX via SuperDocs
                    </button>
                  </div>

                  <div class="flex-1 overflow-y-auto card-dark rounded-xl border border-slate-800 p-4 custom-scrollbar">
                    {register ? (
                      <div class="prose-dark text-xs space-y-4">
                        <div class="grid grid-cols-3 gap-3 p-3 bg-slate-950/60 rounded-lg border border-slate-800 font-mono text-[11px]">
                          <div><span class="text-slate-400">Status:</span> <span class="text-emerald-400 font-bold">RECONCILED</span></div>
                          <div><span class="text-slate-400">Total Facts:</span> <span class="text-white font-bold">{register.facts_count || 32}</span></div>
                          <div><span class="text-slate-400">Resolved Discrepancies:</span> <span class="text-indigo-400 font-bold">{findings.filter(f => f.approval_status === "APPROVED").length}</span></div>
                        </div>

                        <div dangerouslySetInnerHTML={{ __html: marked.parse(register.markdown_report || "### Project Register\n\nAll contractual and billing discrepancies have been audited and resolved.") }} />
                      </div>
                    ) : (
                      <div class="text-center py-16 text-slate-500 text-xs space-y-2">
                        <i class="fa-solid fa-hourglass-half text-2xl text-amber-400/50 mb-2 block"></i>
                        <p>Project Register is pending human gate approvals.</p>
                        <button
                          onClick={() => setActiveTab("findings")}
                          class="text-indigo-400 hover:text-indigo-300 underline font-semibold text-xs"
                        >
                          Review Discrepancies
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* DOCUMENT PREVIEW MODAL */}
          {selectedDoc && (
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-6">
              <div class="glass border border-slate-800 w-full max-w-2xl max-h-[80vh] rounded-2xl flex flex-col overflow-hidden shadow-2xl">
                <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <i class="fa-solid fa-file-lines text-indigo-400 text-sm"></i>
                    <span class="font-bold text-sm text-white">{selectedDoc.filename}</span>
                    <span class="text-[10px] font-mono text-slate-400 bg-slate-900 px-2 py-0.5 rounded border border-slate-800">{selectedDoc.doc_type}</span>
                  </div>
                  <button onClick={() => setSelectedDoc(null)} class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-sm"></i>
                  </button>
                </div>
                <div class="p-4 overflow-y-auto custom-scrollbar text-xs font-mono text-slate-300 leading-relaxed whitespace-pre-wrap">
                  {selectedDoc.text_content || selectedDoc.content || "No preview text available."}
                </div>
              </div>
            </div>
          )}

          {/* SPOTLIGHT SEARCH MODAL (CMD+K) */}
          {spotlightOpen && (
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-start justify-center pt-24 p-6">
              <div class="glass border border-indigo-500/40 w-full max-w-xl rounded-2xl overflow-hidden shadow-2xl flex flex-col">
                <div class="p-3.5 border-b border-slate-800 flex items-center gap-2.5">
                  <i class="fa-solid fa-magnifying-glass text-indigo-400 text-sm"></i>
                  <input
                    type="text"
                    autoFocus
                    value={spotlightQuery}
                    onChange={(e) => { setSpotlightQuery(e.target.value); handleSearch(e.target.value); }}
                    placeholder="Search across all document chunks (<30ms hybrid search)..."
                    class="flex-1 bg-transparent text-xs text-white placeholder-slate-500 focus:outline-none"
                  />
                  <kbd class="text-[10px] font-mono bg-slate-900 text-slate-400 px-1.5 py-0.5 rounded border border-slate-800">ESC</kbd>
                </div>

                <div class="p-2 max-h-72 overflow-y-auto custom-scrollbar space-y-1">
                  {spotlightResults.length === 0 ? (
                    <div class="text-center py-6 text-slate-500 text-xs">
                      {spotlightQuery ? "No matching chunks found." : "Type a query to search grounded document chunks."}
                    </div>
                  ) : (
                    spotlightResults.map((r, idx) => (
                      <div key={idx} class="p-2.5 rounded-lg hover:bg-slate-900/80 cursor-pointer transition text-xs space-y-1 border border-transparent hover:border-slate-800">
                        <div class="flex items-center justify-between text-[10px] text-indigo-400 font-mono">
                          <span>{r.document || r.source} (§{r.chunk_id})</span>
                          <span>Score: {r.score?.toFixed(2) || '0.95'}</span>
                        </div>
                        <p class="text-slate-300 text-xs leading-relaxed">{r.text || r.content}</p>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* CREATE WORKSPACE MODAL */}
          {createModalOpen && (
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-6">
              <div class="glass border border-slate-800 w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl">
                <div class="flex items-center justify-between">
                  <h3 class="font-bold text-sm text-white flex items-center gap-2">
                    <i class="fa-solid fa-folder-plus text-indigo-400"></i>
                    Create Custom Workspace
                  </h3>
                  <button onClick={() => setCreateModalOpen(false)} class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-sm"></i>
                  </button>
                </div>

                <div class="space-y-3 text-xs">
                  <div>
                    <label class="block text-slate-400 mb-1 font-semibold">Workspace Name</label>
                    <input
                      type="text"
                      value={newProjName}
                      onChange={(e) => setNewProjName(e.target.value)}
                      placeholder="e.g. Phase 2 Commercial Audit"
                      class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div>
                    <label class="block text-slate-400 mb-1 font-semibold">Local Document Folder (Optional)</label>
                    <input
                      type="text"
                      value={newDocPath}
                      onChange={(e) => setNewDocPath(e.target.value)}
                      placeholder="/path/to/documents (or leave blank to upload in chat)"
                      class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-white font-mono text-[11px] focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                </div>

                <div class="flex items-center justify-end gap-2 pt-2">
                  <button
                    onClick={() => setCreateModalOpen(false)}
                    class="px-3 py-1.5 text-xs text-slate-400 hover:text-white"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleCreateProject}
                    disabled={!newProjName.trim()}
                    class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white font-bold text-xs rounded-lg transition"
                  >
                    Create Workspace
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
