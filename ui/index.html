<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuMesh AI — Conversational Reconciliation Engine</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Marked.js Markdown Parser CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .gradient-text {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .prose-dark p { margin-bottom: 0.5rem; }
    .prose-dark ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.5rem; }
    .prose-dark strong { color: #f8fafc; font-weight: 700; }
    .prose-dark code { background: rgba(255,255,255,0.1); padding: 0.1rem 0.3rem; border-radius: 0.25rem; font-family: monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [projectId, setProjectId] = useState("proj_greenfield_tech_park");
      const [treeId, setTreeId] = useState("chat_session_main");
      const [pipelineStatus, setPipelineStatus] = useState("AWAITING_HUMAN_GATE");
      const [currentNode, setCurrentNode] = useState("GATE");
      const [sessions, setSessions] = useState([
        { id: "chat_session_main", projectId: "proj_greenfield_tech_park", title: "Greenfield Audit" }
      ]);
      const [documents, setDocuments] = useState([]);
      const [previewDoc, setPreviewDoc] = useState(null);
      const [convertModalOpen, setConvertModalOpen] = useState(false);
      const [timeTravelModalOpen, setTimeTravelModalOpen] = useState(false);
      const [evalsModalOpen, setEvalsModalOpen] = useState(false);
      const [llmModalOpen, setLlmModalOpen] = useState(false);
      const [newProjectNameInput, setNewProjectNameInput] = useState("");
      
      const [chatMessages, setChatMessages] = useState([
        {
          role: "assistant",
          content: "Welcome to **DocuMesh AI**! 👋\n\n**Step 1:** Upload your document files (`.docx`, `.pdf`, `.txt`) using the **📎 attach button** below.\n\nOnce uploaded, I will automatically trigger the **7-stage LangGraph state machine** and show interactive widgets in this chat for review & approval!",
          action_payload: null
        }
      ]);
      const [chatInput, setChatInput] = useState("");
      const [loading, setLoading] = useState(false);
      const [thinkingStage, setThinkingStage] = useState("");
      const [uploading, setUploading] = useState(false);
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const messagesEndRef = useRef(null);
      const fileInputRef = useRef(null);

      useEffect(() => {
        fetchStatus(projectId);
        fetchDocuments(projectId);
        fetchSessions();
      }, [projectId]);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [chatMessages, loading, thinkingStage, uploading]);

      const fetchStatus = async (pId) => {
        try {
          const targetProj = pId || projectId;
          const res = await fetch(`/api/v1/projects/${targetProj}/status`);
          if (res.ok) {
            const data = await res.json();
            setPipelineStatus(data.status);
            setCurrentNode(data.current_node);
          }
        } catch (e) {
          console.error("Status fetch error", e);
        }
      };

      const fetchDocuments = async (pId) => {
        try {
          const targetProj = pId || projectId;
          const res = await fetch(`/api/v1/projects/${targetProj}/documents`);
          if (res.ok) {
            const data = await res.json();
            setDocuments(data.documents || []);
          }
        } catch (e) {
          console.error("Docs error", e);
        }
      };

      const fetchSessions = async () => {
        try {
          const res = await fetch(`/api/v1/projects/${projectId}/sessions`);
          if (res.ok) {
            const data = await res.json();
            if (data.sessions && data.sessions.length > 0) {
              setSessions(data.sessions.map(s => ({ id: s.tree_id, projectId, title: s.title || s.tree_id })));
            }
          }
        } catch (e) {
          console.error("Sessions error", e);
        }
      };

      const createNewChat = async () => {
        const stamp = Date.now().toString().slice(-6);
        const newProjName = "workspace_" + stamp;
        const newTreeId = "chat_session_" + stamp;

        try {
          const res = await fetch(`/api/v1/projects`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ project_name: newProjName })
          });

          if (res.ok) {
            const data = await res.json();
            const newProjId = data.project_id;

            setProjectId(newProjId);
            setTreeId(newTreeId);
            setDocuments([]);
            setCurrentNode("INIT");
            setPipelineStatus("CREATED");

            setSessions(prev => [
              { id: newTreeId, projectId: newProjId, title: "New Workspace " + stamp },
              ...prev
            ]);

            setChatMessages([
              {
                role: "assistant",
                content: `Started a **fresh, empty workspace** (\`${newProjId}\`)!\n\n**Step 1:** Upload your document files (\`.docx\`, \`.pdf\`, \`.txt\`) using the **📎 attach button** below to begin analysis.`,
                action_payload: null
              }
            ]);
          }
        } catch (e) {
          console.error("Create project error", e);
        }
      };

      const convertToNamedProject = async () => {
        if (!newProjectNameInput.trim()) return;

        try {
          const res = await fetch(`/api/v1/projects/${projectId}/sessions/${treeId}/convert-to-project`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ new_project_name: newProjectNameInput })
          });

          if (res.ok) {
            const data = await res.json();
            setProjectId(data.new_project_id);
            setConvertModalOpen(false);

            setSessions(prev => prev.map(s => s.id === treeId ? { ...s, projectId: data.new_project_id, title: data.project_name } : s));

            setChatMessages(prev => [...prev, {
              role: "assistant",
              content: `🎉 Promoted this conversation into formal **Project Workspace: ${data.project_name}** (\`${data.new_project_id}\`)!\n\n• Linked Documents: **${data.documents_count}**\n• Extracted Facts: **${data.facts_count}**\n\nAll team members can now access, audit, and export this project workspace!`
            }]);
          }
        } catch (e) {
          console.error("Convert project error", e);
        }
      };

      const handleFileUpload = async (e) => {
        const files = e.target.files;
        if (!files || files.length === 0) return;

        setUploading(true);
        for (let i = 0; i < files.length; i++) {
          const formData = new FormData();
          formData.append("file", files[i]);

          try {
            const res = await fetch(`/api/v1/projects/${projectId}/documents`, {
              method: "POST",
              body: formData
            });

            if (res.ok) {
              const data = await res.json();
              setChatMessages(prev => [...prev, {
                role: "assistant",
                content: `Uploaded and linked document **${data.filename || files[i].name}**!\n\n• Classified as: \`${data.doc_type || 'UNKNOWN'}\`\n• Extracted facts: **${data.facts_extracted || 0}**\n\nI have received your document. Ask me any question about it or click 'Run Document Pile Scan' below to reconcile!`
              }]);
              fetchDocuments(projectId);
              fetchStatus(projectId);
            }
          } catch (e) {
            console.error("Upload Error", e);
          }
        }
        setUploading(false);
        if (fileInputRef.current) fileInputRef.current.value = "";
      };

      const switchSession = async (sess) => {
        const sId = sess.id;
        const pId = sess.projectId || projectId;

        setProjectId(pId);
        setTreeId(sId);
        fetchDocuments(pId);
        fetchStatus(pId);

        try {
          const res = await fetch(`/api/v1/projects/${pId}/sessions/${sId}`);
          if (res.ok) {
            const data = await res.json();
            if (data.thread && data.thread.length > 0) {
              setChatMessages(data.thread.map(n => ({
                role: n.role,
                content: n.content,
                action_payload: n.metadata?.action_payload || null
              })));
            }
          }
        } catch (e) {
          console.error("Switch session error", e);
        }
      };

      const sendStreamingMessage = async (textToSend) => {
        const query = textToSend || chatInput;
        if (!query.trim()) return;

        setChatInput("");
        setChatMessages(prev => [...prev, { role: "user", content: query }]);
        setLoading(true);
        setThinkingStage("Scanning document graph...");

        setChatMessages(prev => [...prev, { role: "assistant", content: "", action_payload: null }]);

        const encodedQuery = encodeURIComponent(query);
        const eventSource = new EventSource(`/api/v1/projects/${projectId}/sessions/${treeId}/stream?q=${encodedQuery}`);

        let accumulatedContent = "";

        eventSource.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);

            if (data.type === "thinking") {
              setThinkingStage(data.stage);
            } else if (data.type === "chunk") {
              setThinkingStage("");
              accumulatedContent += data.content;
              setChatMessages(prev => {
                const updated = [...prev];
                updated[updated.length - 1].content = accumulatedContent;
                return updated;
              });
            } else if (data.type === "done") {
              setThinkingStage("");
              setChatMessages(prev => {
                const updated = [...prev];
                updated[updated.length - 1].action_payload = data.action_payload;
                return updated;
              });
              eventSource.close();
              setLoading(false);
              fetchSessions();
              fetchStatus(projectId);
            }
          } catch (e) {
            console.error("SSE parse error", e);
          }
        };

        eventSource.onerror = (err) => {
          console.error("SSE stream error", err);
          eventSource.close();
          setLoading(false);
          setThinkingStage("");
        };
      };

      const handleApproveSingle = async (findingId) => {
        try {
          const res = await fetch(`/api/v1/projects/${projectId}/findings/approve`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ finding_id: findingId, approved: true })
          });
          if (res.ok) {
            sendStreamingMessage(`Approved finding ${findingId}. Update register!`);
          }
        } catch (e) {
          console.error("Approve Error", e);
        }
      };

      const renderMarkdown = (text) => {
        if (typeof marked !== "undefined") {
          return { __html: marked.parse(text || "") };
        }
        return { __html: text };
      };

      const stages = [
        { id: "INGEST", label: "1. Ingest" },
        { id: "CLASSIFY", label: "2. Classify" },
        { id: "EXTRACT", label: "3. Extract" },
        { id: "RECONCILE", label: "4. Reconcile" },
        { id: "EXAMINE", label: "5. Examine" },
        { id: "GATE", label: "6. Gate" },
        { id: "DELIVER", label: "7. Deliver" }
      ];

      return (
        <div class="flex h-screen overflow-hidden">
          {/* Hidden File Input */}
          <input
            type="file"
            ref={fileInputRef}
            onChange={handleFileUpload}
            multiple
            accept=".docx,.pdf,.txt,.xlsx,.csv"
            class="hidden"
          />

          {/* LEFT SIDEBAR */}
          <aside class={`${sidebarOpen ? "w-80" : "w-0"} glass-panel border-r border-slate-800 flex flex-col transition-all duration-300 overflow-hidden`}>
            <div class="p-4 border-b border-slate-800 flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <i class="fa-solid fa-cube text-indigo-500 text-xl"></i>
                <span class="font-bold text-sm gradient-text">DocuMesh Workspace</span>
              </div>
              <button onClick={() => setSidebarOpen(false)} class="text-slate-400 hover:text-slate-200">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>

            {/* "+ New Conversation" Button */}
            <div class="p-4 border-b border-slate-800">
              <button
                onClick={createNewChat}
                class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl transition shadow flex items-center justify-center gap-2"
              >
                <i class="fa-solid fa-plus"></i> New Conversation
              </button>
            </div>

            {/* Independent Conversations List */}
            <div class="p-4 border-b border-slate-800/80">
              <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-comments"></i> Conversations & Workspaces
              </h3>
              <div class="space-y-1.5 max-h-40 overflow-y-auto">
                {sessions.map((s) => (
                  <button
                    key={s.id}
                    onClick={() => switchSession(s)}
                    class={`w-full text-left px-3 py-2 rounded-lg text-xs font-medium transition truncate flex items-center gap-2 ${treeId === s.id ? "bg-indigo-600/30 text-indigo-300 border border-indigo-500/40" : "text-slate-300 hover:bg-slate-800/60"}`}
                  >
                    <i class="fa-regular fa-message text-indigo-400 text-xs"></i>
                    <span class="truncate">{s.title}</span>
                  </button>
                ))}
              </div>
            </div>

            {/* Linked Documents Drawer */}
            <div class="p-4 flex-1 overflow-y-auto">
              <div class="flex items-center justify-between mb-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                  <i class="fa-solid fa-box-archive"></i> Linked Documents ({documents.length})
                </h3>
                <button
                  onClick={() => fileInputRef.current?.click()}
                  class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-[11px] rounded-lg transition flex items-center gap-1.5 shadow"
                >
                  <i class="fa-solid fa-cloud-arrow-up"></i> Upload
                </button>
              </div>

              {documents.length === 0 ? (
                <div class="p-4 text-center border border-dashed border-slate-800 rounded-xl text-slate-500 text-xs my-2">
                  No documents uploaded yet. Upload files to start!
                </div>
              ) : (
                <div class="space-y-2">
                  {documents.map((doc, idx) => {
                    let docBadge = "bg-slate-800 text-slate-300";
                    if (doc.filename.endsWith(".pdf")) docBadge = "bg-rose-950/80 text-rose-300 border border-rose-800/40";
                    if (doc.filename.endsWith(".docx")) docBadge = "bg-sky-950/80 text-sky-300 border border-sky-800/40";

                    return (
                      <div
                        key={idx}
                        onClick={() => setPreviewDoc(doc)}
                        class="p-3 rounded-xl bg-slate-900/80 border border-slate-800 text-xs hover:border-indigo-500/50 cursor-pointer transition flex items-center justify-between"
                      >
                        <div class="truncate">
                          <div class="font-semibold text-slate-200 truncate flex items-center gap-2">
                            <span class={`px-1.5 py-0.5 rounded text-[9px] font-mono font-bold ${docBadge}`}>
                              {doc.filename.split('.').pop().toUpperCase()}
                            </span>
                            <span class="truncate">{doc.filename}</span>
                          </div>
                          <div class="text-[10px] text-slate-500 mt-1 font-mono">
                            {doc.doc_type} • {doc.chunks ? doc.chunks.length : 1} Chunks
                          </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-600 text-xs"></i>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {/* Named Capabilities Toolbar Footer */}
            <div class="p-4 border-t border-slate-800 text-[11px] text-slate-300 space-y-1.5">
              <div class="font-bold text-slate-400 uppercase tracking-wider text-[10px] mb-2">Engine Capabilities</div>
              <button onClick={() => setLlmModalOpen(true)} class="w-full text-left px-2.5 py-1.5 rounded bg-slate-900 hover:bg-slate-800 border border-slate-800 text-indigo-300 font-semibold flex items-center gap-2">
                <i class="fa-solid fa-brain text-indigo-400"></i> Multi-Model LLM Engine
              </button>
              <button onClick={() => setTimeTravelModalOpen(true)} class="w-full text-left px-2.5 py-1.5 rounded bg-slate-900 hover:bg-slate-800 border border-slate-800 text-emerald-300 font-semibold flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left text-emerald-400"></i> Time Travel State Rewind
              </button>
              <button onClick={() => setEvalsModalOpen(true)} class="w-full text-left px-2.5 py-1.5 rounded bg-slate-900 hover:bg-slate-800 border border-slate-800 text-purple-300 font-semibold flex items-center gap-2">
                <i class="fa-solid fa-chart-line text-purple-400"></i> Automated Prompt Evals
              </button>
            </div>
          </aside>

          {/* MAIN CHAT AREA */}
          <main class="flex-1 flex flex-col h-screen overflow-hidden">
            {/* Top Bar with 7-Stage State Machine Stepper Widget */}
            <header class="p-4 border-b border-slate-800 flex flex-col gap-3 glass-panel">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  {!sidebarOpen && (
                    <button onClick={() => setSidebarOpen(true)} class="p-2 bg-slate-800 text-slate-300 rounded-lg hover:bg-slate-700 transition">
                      <i class="fa-solid fa-bars"></i>
                    </button>
                  )}
                  <div>
                    <h1 class="text-base font-bold text-slate-100 flex items-center gap-2">
                      <i class="fa-solid fa-robot text-indigo-400"></i> DocuMesh AI Chat
                    </h1>
                    <p class="text-xs text-slate-400">Active Workspace: <span class="font-mono text-indigo-300">{projectId}</span></p>
                  </div>
                </div>

                <div class="flex items-center gap-2">
                  <button
                    onClick={() => setConvertModalOpen(true)}
                    class="px-3 py-1.5 text-xs font-semibold bg-emerald-600/30 hover:bg-emerald-600/50 text-emerald-300 rounded-lg transition border border-emerald-500/40 flex items-center gap-1.5"
                  >
                    <i class="fa-solid fa-bookmark"></i> Convert to Project
                  </button>
                  <button
                    onClick={() => fileInputRef.current?.click()}
                    class="px-3 py-1.5 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition shadow flex items-center gap-1.5"
                  >
                    <i class="fa-solid fa-paperclip"></i> Upload Document
                  </button>
                  <a
                    href={`/api/v1/projects/${projectId}/export-report`}
                    target="_blank"
                    class="px-3 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg transition flex items-center gap-1.5"
                  >
                    <i class="fa-solid fa-file-pdf"></i> Export Report
                  </a>
                </div>
              </div>

              {/* 7-Stage LangGraph State Machine Stepper Widget in Header */}
              <div class="p-2.5 rounded-xl bg-slate-900/90 border border-slate-800/90">
                <div class="flex justify-between items-center text-[11px] font-bold text-slate-400 mb-1.5">
                  <span>LangGraph 7-Stage State Machine Status:</span>
                  <span class="font-mono text-indigo-300">Status: {pipelineStatus}</span>
                </div>
                <div class="grid grid-cols-7 gap-1.5">
                  {stages.map((stg, i) => {
                    const isActive = currentNode === stg.id;
                    const isPassed = ["DELIVER", "GATE_APPROVED", "COMPLETED"].includes(pipelineStatus) || (currentNode === "GATE" && i < 5);

                    let badgeClass = "bg-slate-950 text-slate-500 border-slate-800";
                    if (isActive) badgeClass = "bg-indigo-950 text-indigo-300 border-indigo-500 ring-2 ring-indigo-500/30";
                    else if (isPassed) badgeClass = "bg-emerald-950/60 text-emerald-400 border-emerald-500/40";

                    return (
                      <div key={stg.id} class={`p-1.5 rounded-lg border text-center text-[10px] font-bold truncate transition ${badgeClass}`}>
                        {stg.label}
                      </div>
                    );
                  })}
                </div>
              </div>
            </header>

            {/* Messages Feed */}
            <div class="flex-1 overflow-y-auto p-6 space-y-6">
              {chatMessages.map((msg, idx) => (
                <div key={idx} class={`flex flex-col ${msg.role === "user" ? "items-end" : "items-start"}`}>
                  <div class={`p-5 rounded-2xl max-w-3xl text-sm leading-relaxed ${msg.role === "user" ? "bg-indigo-600 text-white rounded-br-none shadow-lg shadow-indigo-600/20" : "glass-panel text-slate-100 rounded-bl-none shadow-xl border border-slate-800"}`}>
                    
                    {/* Rendered Markdown Response */}
                    <div
                      class="prose-dark font-sans"
                      dangerouslySetInnerHTML={renderMarkdown(msg.content)}
                    />

                    {/* IN-CHAT INTERACTIVE COMPONENT: FINDINGS APPROVAL GATE */}
                    {msg.action_payload?.type === "FINDINGS_APPROVAL_GATE" && (
                      <div class="mt-4 pt-4 border-t border-slate-700/60 space-y-4">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-1.5">
                          <i class="fa-solid fa-triangle-exclamation"></i> Action Required: Review & Approve Findings ({msg.action_payload.pending_findings.length})
                        </h4>

                        {msg.action_payload.pending_findings.map((f) => (
                          <div key={f.finding_id} class="p-4 rounded-xl bg-slate-900/90 border border-slate-800 text-xs">
                            <div class="flex justify-between items-center mb-2">
                              <div class="flex items-center gap-2">
                                <span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-bold border border-amber-500/30 text-[10px]">
                                  {f.severity}
                                </span>
                                <strong class="text-slate-100 font-bold">[{f.finding_id}] {f.title}</strong>
                              </div>
                              <button
                                onClick={() => handleApproveSingle(f.finding_id)}
                                class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded transition text-[11px]"
                              >
                                Approve Fix
                              </button>
                            </div>
                            <p class="text-slate-300 mb-2">{f.description}</p>
                            <div class="font-mono text-indigo-300 bg-indigo-950/40 p-2 rounded border border-indigo-900/50 italic">
                              <strong>Source Quote ({f.source_a.filename}):</strong> "{f.source_a.exact_quote}"
                            </div>
                          </div>
                        ))}

                        <div class="pt-2 flex gap-2">
                          <button
                            onClick={() => sendStreamingMessage("Approve all findings")}
                            class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-lg transition shadow flex items-center justify-center gap-2"
                          >
                            <i class="fa-solid fa-check-double"></i> Batch Approve All Findings
                          </button>
                        </div>
                      </div>
                    )}

                    {/* IN-CHAT INTERACTIVE COMPONENT: RECONCILED REGISTER TABLE */}
                    {msg.action_payload?.type === "SHOW_REGISTER" && msg.action_payload.register && (
                      <div class="mt-4 pt-4 border-t border-slate-700/60">
                        <div class="rounded-xl overflow-hidden border border-slate-800 bg-slate-900/90 text-xs">
                          <table class="w-full text-left">
                            <thead class="bg-slate-950 text-slate-400 font-bold uppercase text-[10px] border-b border-slate-800">
                              <tr>
                                <th class="p-2.5">Metric</th>
                                <th class="p-2.5">Reconciled Value</th>
                                <th class="p-2.5">Status</th>
                                <th class="p-2.5">Citation</th>
                              </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800">
                              {msg.action_payload.register.entries.map((e, eIdx) => (
                                <tr key={eIdx} class="hover:bg-slate-850">
                                  <td class="p-2.5 font-semibold text-slate-200">{e.title}</td>
                                  <td class="p-2.5 font-mono text-indigo-300 font-bold">{e.reconciled_value}</td>
                                  <td class="p-2.5">
                                    <span class={`px-2 py-0.5 rounded text-[10px] font-bold ${e.status === 'CORROBORATED' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}`}>
                                      {e.status}
                                    </span>
                                  </td>
                                  <td class="p-2.5 text-slate-400 font-mono text-[10px]">{e.primary_citation.filename}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              ))}

              {/* Thinking Indicator & Uploading Indicator */}
              {(loading || uploading || thinkingStage) && (
                <div class="flex items-start">
                  <div class="p-4 rounded-2xl glass-panel text-slate-300 text-xs flex items-center gap-3 border border-slate-800 animate-pulse">
                    <i class="fa-solid fa-spinner fa-spin text-indigo-400 text-base"></i>
                    <span>{thinkingStage || (uploading ? "Uploading & ingesting document file..." : "DocuMesh AI is reasoning over the document graph...")}</span>
                  </div>
                </div>
              )}
              <div ref={messagesEndRef} />
            </div>

            {/* Chat Input Bar */}
            <form onSubmit={(e) => { e.preventDefault(); sendStreamingMessage(); }} class="p-6 pt-2 flex gap-3">
              <button
                type="button"
                onClick={() => fileInputRef.current?.click()}
                class="px-4 py-3.5 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-2xl border border-slate-800 hover:border-indigo-500/50 transition flex items-center justify-center text-base"
                title="Attach Document File (.docx, .pdf, .txt)"
              >
                <i class="fa-solid fa-paperclip"></i>
              </button>
              <input
                type="text"
                value={chatInput}
                onChange={(e) => setChatInput(e.target.value)}
                placeholder="Ask anything, type 'run analysis', or attach document files..."
                class="flex-1 px-5 py-3.5 bg-slate-900 border border-slate-800 rounded-2xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition shadow-inner"
              />
              <button
                type="submit"
                disabled={loading || uploading}
                class="px-6 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-2xl text-sm transition shadow-lg shadow-indigo-600/20 flex items-center gap-2"
              >
                <i class="fa-solid fa-paper-plane"></i>
              </button>
            </form>
          </main>

          {/* ARTIFACT PREVIEW MODAL */}
          {previewDoc && (
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-6 z-50">
              <div class="glass-panel p-6 rounded-2xl max-w-2xl w-full border border-slate-700 shadow-2xl flex flex-col max-h-[80vh]">
                <div class="flex justify-between items-center pb-4 border-b border-slate-800">
                  <div class="flex items-center gap-2">
                    <i class="fa-solid fa-file-lines text-indigo-400 text-lg"></i>
                    <h3 class="text-base font-bold text-slate-100">{previewDoc.filename}</h3>
                  </div>
                  <button onClick={() => setPreviewDoc(null)} class="text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>
                <div class="p-4 my-4 bg-slate-900/90 rounded-xl font-mono text-xs text-slate-300 overflow-y-auto flex-1 whitespace-pre-wrap border border-slate-800">
                  {previewDoc.extracted_text || "No preview text available."}
                </div>
                <div class="flex justify-end">
                  <button onClick={() => setPreviewDoc(null)} class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg">
                    Close Preview
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MULTI-MODEL LLM MODAL */}
          {llmModalOpen && (
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-6 z-50">
              <div class="glass-panel p-6 rounded-2xl max-w-md w-full border border-indigo-500/40 shadow-2xl">
                <div class="flex justify-between items-center pb-4 border-b border-slate-800">
                  <h3 class="text-base font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-brain text-indigo-400"></i> Multi-Model LLM Config
                  </h3>
                  <button onClick={() => setLlmModalOpen(false)} class="text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-xmark"></i>
                  </button>
                </div>
                <div class="my-4 space-y-3 text-xs text-slate-300">
                  <p>Supports native OpenAI (`gpt-4o`), Anthropic Claude (`3.5 Sonnet`), Google Gemini (`1.5 Pro`), and custom OpenAI-compatible endpoints (`OPENAI_BASE_URL` for Together, Ollama, OpenRouter, or vLLM).</p>
                </div>
                <div class="flex justify-end pt-2 border-t border-slate-800">
                  <button onClick={() => setLlmModalOpen(false)} class="px-4 py-2 bg-indigo-600 text-white font-bold text-xs rounded-lg">Close</button>
                </div>
              </div>
            </div>
          )}

          {/* TIME TRAVEL MODAL */}
          {timeTravelModalOpen && (
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-6 z-50">
              <div class="glass-panel p-6 rounded-2xl max-w-md w-full border border-emerald-500/40 shadow-2xl">
                <div class="flex justify-between items-center pb-4 border-b border-slate-800">
                  <h3 class="text-base font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-emerald-400"></i> LangGraph Time Travel
                  </h3>
                  <button onClick={() => setTimeTravelModalOpen(false)} class="text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-xmark"></i>
                  </button>
                </div>
                <div class="my-4 space-y-3 text-xs text-slate-300">
                  <p>Rewind pipeline state machine back to any prior checkpoint node (`/api/v1/projects/{id}/rewind`) and re-branch graph execution!</p>
                </div>
                <div class="flex justify-end pt-2 border-t border-slate-800">
                  <button onClick={() => setTimeTravelModalOpen(false)} class="px-4 py-2 bg-emerald-600 text-white font-bold text-xs rounded-lg">Close</button>
                </div>
              </div>
            </div>
          )}

          {/* EVALS MODAL */}
          {evalsModalOpen && (
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-6 z-50">
              <div class="glass-panel p-6 rounded-2xl max-w-md w-full border border-purple-500/40 shadow-2xl">
                <div class="flex justify-between items-center pb-4 border-b border-slate-800">
                  <h3 class="text-base font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-chart-line text-purple-400"></i> Automated Prompt Evals
                  </h3>
                  <button onClick={() => setEvalsModalOpen(false)} class="text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-xmark"></i>
                  </button>
                </div>
                <div class="my-4 space-y-3 text-xs text-slate-300">
                  <p>Run prompt evaluation benchmark suite (`/api/v1/evals/run`) to score Faithfulness, Recall, and Prompt Injection Resistance across system prompt variants.</p>
                </div>
                <div class="flex justify-end pt-2 border-t border-slate-800">
                  <button onClick={() => setEvalsModalOpen(false)} class="px-4 py-2 bg-purple-600 text-white font-bold text-xs rounded-lg">Close</button>
                </div>
              </div>
            </div>
          )}

          {/* CONVERT TO PROJECT MODAL */}
          {convertModalOpen && (
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-6 z-50">
              <div class="glass-panel p-6 rounded-2xl max-w-md w-full border border-slate-700 shadow-2xl">
                <div class="flex justify-between items-center pb-4 border-b border-slate-800">
                  <h3 class="text-base font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-bookmark text-emerald-400"></i> Promote Chat to Named Project
                  </h3>
                  <button onClick={() => setConvertModalOpen(false)} class="text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-xmark"></i>
                  </button>
                </div>
                <div class="my-4 space-y-3">
                  <label class="text-xs font-semibold text-slate-300">Project Name:</label>
                  <input
                    type="text"
                    value={newProjectNameInput}
                    onChange={(e) => setNewProjectNameInput(e.target.value)}
                    placeholder="e.g. Phase 2 Construction Audit"
                    class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"
                  />
                  <p class="text-[11px] text-slate-400">This will save all documents, extracted facts, and findings from this chat session into a permanent project workspace.</p>
                </div>
                <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
                  <button
                    onClick={() => setConvertModalOpen(false)}
                    class="px-4 py-2 bg-slate-800 text-slate-300 text-xs font-semibold rounded-lg hover:bg-slate-700"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={convertToNamedProject}
                    class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-lg shadow transition"
                  >
                    Promote Project
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
