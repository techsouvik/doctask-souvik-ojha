version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: documesh_postgres
    restart: always
    environment:
      POSTGRES_USER: documesh
      POSTGRES_PASSWORD: documesh_password
      POSTGRES_DB: documesh_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documesh -d documesh_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: documesh_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
